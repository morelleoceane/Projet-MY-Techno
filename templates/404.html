{% extends "base.html" %}
{% block title %}Page introuvable – ModeShopping Flask{% endblock %}

{% block content %}
<div class="text-center py-5">
    <div class="display-1 fw-bold text-warning">404</div>
    <h2 class="fw-bold mt-3">Page introuvable</h2>
    <p class="text-muted fs-5">
        L'article ou la page que vous cherchez n'existe pas ou n'est plus disponible.
    </p>
    <div class="mt-4 d-flex gap-3 justify-content-center">
        <a href="{{ url_for('accueil') }}" class="btn btn-dark btn-lg px-5">
            <i class="bi bi-house"></i> Accueil
        </a>
        <a href="{{ url_for('catalogue') }}" class="btn btn-outline-dark btn-lg px-5">
            <i class="bi bi-grid"></i> Catalogue
        </a>
    </div>
</div>
{% endblock %}
